<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login/Register Page -->
    <div id="auth-page" class="page active">
        <div class="auth-container">
            <div class="auth-box">
                <h1>Document Management System</h1>
                
                <!-- Login Form -->
                <div id="login-form" class="auth-form active">
                    <h2>Login</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="login-email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                        <p class="toggle-auth">Don't have an account? <a href="#" onclick="toggleAuthForm()">Register</a></p>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="register-form" class="auth-form">
                    <h2>Register</h2>
                    <form id="registerForm">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="register-username" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="register-email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="register-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                        <p class="toggle-auth">Already have an account? <a href="#" onclick="toggleAuthForm()">Login</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Page -->
    <div id="main-page" class="page">
        <!-- Header -->
        <header>
            <div class="container">
                <h1>📄 Document Management System</h1>
                <div class="user-info">
                    <span id="username-display"></span>
                    <button onclick="logout()" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </header>

        <div class="container main-content">
            <!-- Upload Section -->
            <div class="upload-section">
                <h2>Upload Document</h2>
                <form id="uploadForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="doc-title" required>
                        </div>
                        <div class="form-group">
                            <label>File</label>
                            <input type="file" id="doc-file" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="doc-description">
                        </div>
                        <div class="form-group">
                            <label>Tags (comma separated)</label>
                            <input type="text" id="doc-tags" placeholder="e.g. report, 2024, finance">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Document</button>
                </form>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <h2>Search Documents</h2>
                <div class="search-controls">
                    <input type="text" id="search-query" placeholder="Search by title, description...">
                    <input type="text" id="search-tags" placeholder="Filter by tags (comma separated)">
                    <button onclick="searchDocuments()" class="btn btn-primary">Search</button>
                    <button onclick="loadDocuments()" class="btn btn-secondary">Show All</button>
                </div>
            </div>

            <!-- Documents List -->
            <div class="documents-section">
                <h2>My Documents</h2>
                <div id="documents-list" class="documents-grid">
                    <!-- Documents will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Document Detail Modal -->
    <div id="document-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body">
                <!-- Document details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/documents.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
